<ion-header><ion-toolbar color="primary"><ion-title>Compra</ion-title></ion-toolbar></ion-header>
<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="enviar()">
    <ion-item>
      <ion-input label="Producto" labelPlacement="floating" formControlName="producto"></ion-input>
    </ion-item>
    @if (invalido('producto')) { <ion-note color="danger">El nombre es obligatorio.</ion-note> }

    <ion-item>
      <ion-input label="Cantidad" labelPlacement="floating" type="number" formControlName="cantidad"></ion-input>
    </ion-item>
    @if (invalido('cantidad')) { <ion-note color="danger">Debe ser un entero mayor que 0.</ion-note> }

    <ion-item>
      <ion-input label="Precio unitario" labelPlacement="floating" type="number" formControlName="precio"></ion-input>
    </ion-item>
    @if (invalido('precio')) { <ion-note color="danger">El precio debe ser mayor que 0.</ion-note> }

    <ion-button expand="block" type="submit" class="ion-margin-top">Ir a pagar</ion-button>
  </form>
</ion-content>
